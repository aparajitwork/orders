name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: yarn

    - name: Enable corepack
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable

    - name: Lint
      run: yarn workspaces foreach --all run lint

    - name: Test
      run: yarn workspace @orders/app test